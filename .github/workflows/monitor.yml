name: Monitor de boletas

on:
  push:
    branches: [codex/initial-monitor]
    paths:
      - '.github/workflows/monitor.yml'
  schedule:
    # Evita el minuto 0, donde suele concentrarse la carga de GitHub.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Enviar también un Telegram de prueba
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cinema-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Solo la rama predeterminada recibe secretos y modifica el historial compartido.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      DATA_DIR: data
      CHECK_INTERVAL_SECONDS: '300'
      CONFIRMATIONS: '1'
      PAGE_TIMEOUT_SECONDS: '60'
      NOTIFY_RETRY_SECONDS: '300'
      NOTIFIER: telegram
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas del monitor y persistencia
        run: python -m unittest -q
      - name: Recuperar navegador de caché
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
      - name: Preparar Chromium
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Recuperar historial persistente
        id: restore
        run: python github_state.py restore
      - name: Probar Telegram si se solicitó
        id: notification_test
        if: inputs.test_notification == true
        continue-on-error: true
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python monitor.py --test-notification
      - name: Revisar cartelera y enviar aviso si corresponde
        id: check
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python monitor.py --once
      - name: Guardar historial aunque falle la lectura o el envío
        if: always() && steps.restore.outcome == 'success'
        run: python github_state.py save
      - name: Resumen
        if: always()
        run: python github_state.py summary
      - name: Señalar fallo de la prueba de Telegram
        if: always() && steps.notification_test.outcome == 'failure'
        run: |
          echo '::error::Telegram no aceptó la prueba. Revisa TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID y que hayas iniciado el chat con el bot.'
          exit 1
